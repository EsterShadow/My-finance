<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Finance</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E66E02">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Finance">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

  <div class="app">

    <!-- ===== ОТЧЁТЫ ===== -->
    <div id="tab-reports" class="tab-content">
      <div id="reports-pinned"></div>
      <div id="reports-list" class="reports-list"></div>
      <div class="btn-add-report-wrap">
        <button id="btn-new-report" class="btn-primary">Новый отчёт</button>
      </div>
    </div>

    <!-- ===== РАСХОДЫ ===== -->
    <div id="tab-expenses" class="tab-content active">
      <div class="expense-top">
        <button id="expense-date-label" class="date-label">сегодня</button>
        <div class="amount-line"><div id="amount-input" class="amount-input" contenteditable="true" inputmode="decimal" enterkeyhint="done" role="textbox" aria-label="Сумма" data-placeholder="0,00"></div><span class="amount-rub">₽</span></div>
      </div>

      <div class="field-row">
        <div id="category-search" class="field-input" contenteditable="true" enterkeyhint="done" role="textbox" aria-label="Категория" data-placeholder="Начните вводить категорию"></div>
        <button id="btn-add-category" class="btn-add-cat hidden" aria-label="Создать категорию">✓</button>
        <button id="btn-clear-category" class="btn-clear-cat hidden" aria-label="Сбросить категорию">✕</button>
      </div>
      <div id="note-row" class="field-row note-row hidden">
        <div id="note-input" class="field-input" contenteditable="true" enterkeyhint="done" role="textbox" aria-label="Описание" data-placeholder="Описание"></div>
      </div>

      <div id="category-list" class="category-list"></div>

      <div class="btn-save-wrap">
        <button id="btn-save-expense" class="btn-primary">Новая запись</button>
      </div>
    </div>

    <!-- ===== ИСТОРИЯ ===== -->
    <div id="tab-history" class="tab-content">
      <div class="history-header">
        <label class="history-search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="text" id="history-search" placeholder="Поиск" autocomplete="off">
        </label>
        <div class="history-summary">
          <div class="history-summary-main">
            <div id="history-total" class="history-total"></div>
            <div class="history-period">
              <button id="hp-from"></button><span>/</span><button id="hp-to"></button>
            </div>
          </div>
          <div class="history-actions">
            <button id="btn-view-toggle" class="icon-btn"></button>
            <button id="btn-filter" class="icon-btn" aria-label="Фильтр">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            </button>
            <button id="btn-data-menu" class="icon-btn" aria-label="Данные">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="history-list" class="history-list"></div>
      <div id="history-snackbar" class="snackbar hidden">
        <span class="snackbar-text"></span>
        <button class="snackbar-action">Сбросить</button>
      </div>
      <input type="file" id="import-file-input" accept=".json,application/json" hidden>
    </div>

    <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
    <nav class="bottom-nav">
      <button class="nav-btn" data-tab="reports">
        <span class="nav-ico" style="-webkit-mask-image:url(icons/nav/reports.png);mask-image:url(icons/nav/reports.png)"></span>
        <span>Отчёты</span>
      </button>
      <button class="nav-btn active" data-tab="expenses">
        <span class="nav-ico" style="-webkit-mask-image:url(icons/nav/expenses.png);mask-image:url(icons/nav/expenses.png)"></span>
        <span>Расходы</span>
      </button>
      <button class="nav-btn" data-tab="history">
        <span class="nav-ico" style="-webkit-mask-image:url(icons/nav/history.png);mask-image:url(icons/nav/history.png)"></span>
        <span>История</span>
      </button>
    </nav>

  </div>

  <script src="js/periods.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/export.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/filter-editor.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/dashboards.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
