<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Finance</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5E463D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Finance">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

  <div class="app">

    <!-- ===== TAB: ОТЧЁТЫ ===== -->
    <div id="tab-reports" class="tab-content">
      <div id="reports-list" class="reports-list"></div>
      <div class="btn-add-report-wrap">
        <button id="btn-new-report" class="btn-add-report">Новый отчёт</button>
      </div>
    </div>

    <!-- ===== TAB: РАСХОДЫ ===== -->
    <div id="tab-expenses" class="tab-content active">
      <div class="expense-top">
        <span id="expense-date-label" class="date-label">сегодня</span>
        <input type="date" id="expense-date-input" class="date-input-hidden">
        <div class="amount-wrap">
          <input
            type="text"
            id="amount-input"
            class="amount-input"
            inputmode="decimal"
            placeholder="0,00"
            autocomplete="off"
          >
        </div>
      </div>

      <div class="expense-middle">
        <div class="field-row">
          <input
            type="text"
            id="category-search"
            class="field-input"
            placeholder="Начните вводить категорию"
            autocomplete="off"
          >
          <button id="btn-add-category" class="btn-add-cat hidden" title="Добавить новую категорию">✓</button>
        </div>
        <div id="note-row" class="field-row hidden">
          <input
            type="text"
            id="note-input"
            class="field-input"
            placeholder="Заметка (необязательно)"
            autocomplete="off"
          >
        </div>
      </div>

      <div id="category-list" class="category-list"></div>

      <div class="btn-save-wrap">
        <button id="btn-save-expense" class="btn-primary" disabled>Новая запись</button>
      </div>
    </div>

    <!-- ===== TAB: ИСТОРИЯ ===== -->
    <div id="tab-history" class="tab-content">
      <div class="history-header">
        <input type="text" id="history-search" class="search-input" placeholder="Поиск">
        <button id="btn-export-csv" class="btn-export" title="Экспорт в Excel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          CSV
        </button>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>

    <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
    <nav class="bottom-nav">
      <button class="nav-btn" data-tab="reports">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="8" height="8" rx="1.5"/>
          <rect x="13" y="3" width="8" height="8" rx="1.5"/>
          <rect x="3" y="13" width="8" height="8" rx="1.5"/>
          <rect x="13" y="13" width="8" height="8" rx="1.5"/>
        </svg>
        <span>Отчёты</span>
      </button>
      <button class="nav-btn active" data-tab="expenses">
        <svg width="22" height="22" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="currentColor"/>
          <path d="M12 7v10M7 12h10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>Расходы</span>
      </button>
      <button class="nav-btn" data-tab="history">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
          <rect x="3" y="4" width="4" height="4" fill="currentColor" stroke="none" rx="0.5"/>
          <rect x="3" y="10" width="4" height="4" fill="currentColor" stroke="none" rx="0.5"/>
          <rect x="3" y="16" width="4" height="4" fill="currentColor" stroke="none" rx="0.5"/>
        </svg>
        <span>История</span>
      </button>
    </nav>

  </div>

  <!-- ===== МОДАЛЬНОЕ ОКНО (детализация отчёта) ===== -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-header">
        <span id="modal-title" class="modal-title"></span>
        <button id="modal-close" class="modal-close" aria-label="Закрыть">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- ===== iOS ПОДСКАЗКА ===== -->
  <div id="ios-hint" class="ios-hint hidden">
    Добавьте на главный экран: нажмите <strong>⎙</strong> → «На экран "Домой"»
    <button id="ios-hint-close" class="ios-hint-close" aria-label="Закрыть">✕</button>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
